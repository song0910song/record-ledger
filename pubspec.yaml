name: record_ledger
description: 极简预算记账 - 无广告、离线、数据归自己
publish_to: 'none'
version: 1.2.0+6

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.0.0
  intl: ^0.17.0
  fl_chart: ^1.2.0
  share_plus: 13.3.0
  shared_preferences: ^2.0.0
  sqflite_common_ffi_web: ^1.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

