pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null : "flutter.sdk not set in local.properties"
        path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.11.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}

include ':app'

// ---------------------------------------------------------------------------
// 网络适配：本地环境无法访问 dl.google.com / repo.maven.apache.org。
// 在任何项目被评估之前，把国内镜像仓库插入其 buildscript / 依赖仓库的最前面。
// 脚本块（script handler）是活的，这里的 add 会立即生效。
// ---------------------------------------------------------------------------
gradle.beforeProject { proj ->
    def addMirrors = { handler ->
        [
            'https://maven.aliyun.com/repository/google',
            'https://maven.aliyun.com/repository/public',
            'https://maven.aliyun.com/repository/gradle-plugin',
            'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/',
        ].reverseEach { u ->
            // 逆序插入，保证排列后 aliyun-google 位于首位
            handler.maven { url u }
        }
    }
    addMirrors(proj.buildscript.repositories)
    addMirrors(proj.repositories)
}

gradle.settingsEvaluated { settings ->
    [
        'https://maven.aliyun.com/repository/google',
        'https://maven.aliyun.com/repository/public',
        'https://maven.aliyun.com/repository/gradle-plugin',
    ].reverseEach { u ->
        settings.pluginManagement.repositories.maven { url u }
    }
}
